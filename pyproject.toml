[project]
name = "sql-summarizer"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0.52",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.5",
    "langchain>=1.3.18",
    "langchain-google-genai>=4.3.7",
    "langchain-groq>=1.1.3",
    "python-dotenv>=1.2.3",
    "sqlglot>=30.18.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=90"
