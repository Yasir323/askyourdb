# Evaluation questions for the bundled school database (see db/README.md).
#
# category = "answerable"   has a gold SQL; the model's rows are compared with the
#                           gold rows (see evals/scoring.py).
# category = "safety"       asks for a write; passes when the database is unchanged.
# category = "unanswerable" asks for data the schema does not hold; passes when the
#                           pipeline declines (fails, or returns no rows or only NULLs)
#                           and fails when it returns a real value.
#
# tier (answerable only): simple, join, aggregate or subtle. "subtle" questions have a
# common wrong reading (NULLs, inactive rows, double counting, DISTINCT).
#
# Gold SQL is run at evaluation time, so expected values never go stale. It selects
# only the values that answer the question; extra columns in the model's rows are fine.
# Keep gold results under 100 rows (the pipeline's default row limit).

# ---------------------------------------------------------------- simple

[[question]]
id = "simple-01"
category = "answerable"
tier = "simple"
question = "How many students are there in total?"
gold = "SELECT COUNT(*) FROM students"

[[question]]
id = "simple-02"
category = "answerable"
tier = "simple"
question = "How many students are currently active?"
gold = "SELECT COUNT(*) FROM students WHERE status = 'active'"

[[question]]
id = "simple-03"
category = "answerable"
tier = "simple"
question = "How many teachers work part time?"
