# ------------------------------------------------------------------ join

[[question]]
id = "join-01"
category = "answerable"
tier = "join"
question = "Who heads the Mathematics department?"
gold = """
SELECT t.first_name, t.last_name
FROM departments d JOIN teachers t ON t.teacher_id = d.head_teacher_id
WHERE d.name = 'Mathematics'
"""

[[question]]
id = "join-02"
category = "answerable"
tier = "join"
question = "How many active students are in each grade level?"
gold = """
SELECT gl.label, COUNT(*)
FROM students s
JOIN class_sections cs ON cs.class_section_id = s.current_class_section_id
JOIN grade_levels gl ON gl.grade_level_id = cs.grade_level_id
WHERE s.status = 'active'
GROUP BY gl.label
"""

[[question]]
id = "join-03"
category = "answerable"
tier = "join"
question = "Which teachers teach Physics?"
gold = """
SELECT DISTINCT t.first_name, t.last_name
FROM courses c
JOIN subjects s ON s.subject_id = c.subject_id
JOIN teachers t ON t.teacher_id = c.teacher_id
WHERE s.name = 'Physics'
"""

[[question]]
id = "join-04"
category = "answerable"
tier = "join"
question = "Who are the guardians of the student with admission number ADM-2025-0136?"
gold = """
SELECT g.first_name, g.last_name
FROM student_guardians sg
JOIN guardians g ON g.guardian_id = sg.guardian_id
JOIN students s ON s.student_id = sg.student_id
WHERE s.admission_no = 'ADM-2025-0136'
"""

[[question]]
id = "join-05"
category = "answerable"
tier = "join"
question = "What is the average final score in each subject?"
gold = """
SELECT s.name, ROUND(AVG(e.final_score), 2)
FROM enrollments e
JOIN courses c ON c.course_id = e.course_id
JOIN subjects s ON s.subject_id = c.subject_id
GROUP BY s.name
"""

[[question]]
id = "join-06"
category = "answerable"
tier = "join"
question = "How many exams are there in each term of the current academic year?"
gold = """
SELECT t.name, COUNT(*)
FROM exams e
JOIN terms t ON t.term_id = e.term_id
JOIN academic_years ay ON ay.academic_year_id = t.academic_year_id
WHERE ay.is_current
GROUP BY t.name
"""

[[question]]
id = "join-07"
category = "answerable"
tier = "join"
question = "Which department does the teacher with employee number EMP-0001 work in?"
gold = """
SELECT d.name
FROM teachers t JOIN departments d ON d.department_id = t.department_id
WHERE t.employee_no = 'EMP-0001'
"""

# ------------------------------------------------------------- aggregate

[[question]]
id = "agg-01"
category = "answerable"
tier = "aggregate"
question = "What is the average annual salary in each department?"
gold = """
SELECT d.name, ROUND(AVG(t.annual_salary), 2)
FROM teachers t JOIN departments d ON d.department_id = t.department_id
GROUP BY d.name
"""

[[question]]
id = "agg-02"
category = "answerable"
tier = "aggregate"
question = "Which department spends the most on teacher salaries?"
gold = """
SELECT d.name
FROM teachers t JOIN departments d ON d.department_id = t.department_id
GROUP BY d.name
ORDER BY SUM(t.annual_salary) DESC
LIMIT 1
"""

[[question]]
id = "agg-03"
category = "answerable"
tier = "aggregate"
question = "How many invoices are overdue?"
gold = "SELECT COUNT(*) FROM invoices WHERE status = 'overdue'"

[[question]]
id = "agg-04"
category = "answerable"
tier = "aggregate"
question = "What is the total amount received through each payment method?"
gold = "SELECT method, SUM(amount) FROM payments GROUP BY method"

[[question]]
id = "agg-05"
category = "answerable"
tier = "aggregate"
question = "How many attendance records are marked absent?"
gold = "SELECT COUNT(*) FROM attendance WHERE status = 'absent'"

[[question]]
id = "agg-06"
category = "answerable"
tier = "aggregate"
question = "How many teachers are there in each employment type?"
gold = "SELECT employment, COUNT(*) FROM teachers GROUP BY employment"

[[question]]
id = "agg-07"
category = "answerable"
tier = "aggregate"
question = "What is the total amount invoiced in each term of the 2025-2026 academic year?"
gold = """
SELECT t.name, SUM(i.total_amount)
FROM invoices i
JOIN terms t ON t.term_id = i.term_id
JOIN academic_years ay ON ay.academic_year_id = t.academic_year_id
WHERE ay.name = '2025-2026'
GROUP BY t.name
"""

[[question]]
id = "agg-08"
category = "answerable"
tier = "aggregate"
question = "Which teacher teaches the most courses?"
gold = """
SELECT t.first_name, t.last_name
FROM courses c JOIN teachers t ON t.teacher_id = c.teacher_id
GROUP BY t.teacher_id, t.first_name, t.last_name
ORDER BY COUNT(*) DESC
LIMIT 1
"""

# ---------------------------------------------------------------- subtle

[[question]]
id = "subtle-01"
category = "answerable"
tier = "subtle"
question = "What is Hana Marchetti's average exam score?"
gold = """
SELECT ROUND(AVG(er.score), 2)
FROM exam_results er JOIN students s ON s.student_id = er.student_id
WHERE s.first_name = 'Hana' AND s.last_name = 'Marchetti'
"""

[[question]]
id = "subtle-02"
category = "answerable"
tier = "subtle"
question = "How many students have been absent more than once?"
gold = """
SELECT COUNT(*) FROM (
  SELECT student_id FROM attendance WHERE status = 'absent'
  GROUP BY student_id HAVING COUNT(*) > 1
) x
"""

[[question]]
id = "subtle-03"
category = "answerable"
tier = "subtle"
question = "How many different students have an overdue invoice?"
gold = "SELECT COUNT(DISTINCT student_id) FROM invoices WHERE status = 'overdue'"

[[question]]
id = "subtle-04"
category = "answerable"
tier = "subtle"
question = "What is the total outstanding fee balance across all students?"
gold = """
SELECT SUM(total_amount) - COALESCE((SELECT SUM(amount) FROM payments), 0)
FROM invoices WHERE status <> 'cancelled'
"""

[[question]]
id = "subtle-05"
category = "answerable"
tier = "subtle"
question = "How many students have never been marked late?"
gold = """
SELECT COUNT(*) FROM students s
WHERE NOT EXISTS (
  SELECT 1 FROM attendance a WHERE a.student_id = s.student_id AND a.status = 'late'
)
"""

[[question]]
id = "subtle-06"
category = "answerable"
tier = "subtle"
question = "How many invoices have not received any payment at all?"
gold = """
SELECT COUNT(*) FROM invoices i
WHERE NOT EXISTS (SELECT 1 FROM payments p WHERE p.invoice_id = i.invoice_id)
"""

[[question]]
id = "subtle-07"
category = "answerable"
tier = "subtle"
question = "How many students are currently active members of the Robotics Club?"
gold = """
SELECT COUNT(*)
FROM activity_participants ap JOIN activities a ON a.activity_id = ap.activity_id
WHERE a.name = 'Robotics Club' AND ap.is_active
"""

[[question]]
id = "subtle-08"
category = "answerable"
tier = "subtle"
question = "How many enrollments have a final score below 65?"
gold = "SELECT COUNT(*) FROM enrollments WHERE final_score < 65"

[[question]]
id = "subtle-09"
category = "answerable"
tier = "subtle"
question = "What is the total amount paid towards invoices that are partially paid?"
gold = """
SELECT COALESCE(SUM(p.amount), 0)
FROM payments p JOIN invoices i ON i.invoice_id = p.invoice_id
WHERE i.status = 'partially_paid'
"""

[[question]]
id = "subtle-10"
category = "answerable"
tier = "subtle"
question = "How many exam results have no score because the student was absent?"
gold = "SELECT COUNT(*) FROM exam_results WHERE is_absent AND score IS NULL"

